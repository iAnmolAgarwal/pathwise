# Pings the deployed app every ten minutes so Neon's free-tier compute (which suspends
# after five idle minutes) and the Vercel function stay warm for whoever opens the app
# next. /api/health does one `select 1`; the run fails only if the app reports the
# database unreachable, which is worth a red badge. workflow_dispatch to run it by hand.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/health
        run: |
          set -o pipefail
          curl --fail --silent --show-error --max-time 30 https://trypathwise.vercel.app/api/health | tee health.json
