# Every push to main and every pull request: types, lint, and the full Vitest suite on both
# platforms the team uses. The Windows leg is the one that catches line-ending and
# path-separator problems before they reach main.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
